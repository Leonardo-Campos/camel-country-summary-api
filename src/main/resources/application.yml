server:
  port: 8080
  servlet:
    context-path: /

camel:
  springboot:
    name: camel-country-summary
  servlet:
    mapping:
      context-path: /api/*
  component:
    servlet:
      mapping:
        context-path: /api/*

api:
  restcountries:
    url: https://restcountries.com/v3.1
  openweathermap:
    url: https://api.openweathermap.org/data/2.5
    key: ${OPENWEATHERMAP_API_KEY:your-api-key-here}
  exchangerate:
    url: https://api.exchangerate.host
    key: ${EXCHANGERATE_API_KEY:your-api-key-here}

management:
  endpoints:
    web:
      exposure:
        include: health,info,camelroutes
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.apache.camel: INFO
    com.leonardocampos: DEBUG
