server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: camel-country-summary
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s

camel:
  springboot:
    name: camel-country-summary
  servlet:
    mapping:
      context-path: /api/*
  component:
    servlet:
      mapping:
        context-path: /api/*
    http:
      connectTimeout: 5000
      socketTimeout: 10000
      connectionManagerShared: true

api:
  restcountries:
    url: https://restcountries.com/v3.1
  openweathermap:
    url: https://api.openweathermap.org/data/2.5
    key: ${OPENWEATHERMAP_API_KEY:}
  exchangerate:
    url: https://api.exchangerate.host
    key: ${EXCHANGERATE_API_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,camelroutes
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}

logging:
  structured:
    format:
      console: ${CONSOLE_LOG_STRUCTURED_FORMAT:logstash}
  level:
    org.apache.camel: DEBUG
    org.apache.camel.component.http: DEBUG
    org.apache.http: DEBUG
    com.leonardocampos: DEBUG

cache:
  redis:
    ttl-minutes: ${REDIS_CACHE_TTL_MINUTES:30}
