# Server Configuration
server.port=8080
server.servlet.context-path=/

# Camel Servlet Configuration
camel.servlet.mapping.context-path=/api/*

# REST Countries API
api.restcountries.url=https://restcountries.com/v3.1

# OpenWeatherMap API
api.openweathermap.url=https://api.openweathermap.org/data/2.5
api.openweathermap.key=${OPENWEATHERMAP_API_KEY:your-api-key-here}

# ExchangeRate API
api.exchangerate.url=https://api.exchangerate.host
api.exchangerate.key=${EXCHANGERATE_API_KEY:your-api-key-here}

# Camel Configuration
camel.springboot.name=camel-country-summary
camel.component.servlet.mapping.context-path=/api/*

# Actuator
management.endpoints.web.exposure.include=health,info,camelroutes
management.endpoint.health.show-details=always

# Logging
logging.level.org.apache.camel=INFO
logging.level.com.leonardocampos=DEBUG
