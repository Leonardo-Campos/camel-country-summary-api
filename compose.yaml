services:
  redis:
    image: redis:7-alpine
    container_name: camel-country-summary-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
    container_name: camel-country-summary-app
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      OPENWEATHERMAP_API_KEY: ${OPENWEATHERMAP_API_KEY}
      EXCHANGERATE_API_KEY: ${EXCHANGERATE_API_KEY}
    ports:
      - "8080:8080"
