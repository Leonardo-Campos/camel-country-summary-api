apiVersion: v1
kind: Secret
metadata:
  name: camel-country-summary-secrets
  namespace: camel-country-summary
type: Opaque
stringData:
  OPENWEATHERMAP_API_KEY: replace-me
  EXCHANGERATE_API_KEY: replace-me
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: camel-country-summary
  namespace: camel-country-summary
  labels:
    app: camel-country-summary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: camel-country-summary
  template:
    metadata:
      labels:
        app: camel-country-summary
    spec:
      containers:
        - name: camel-country-summary
          image: camel-country-summary:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: REDIS_HOST
              value: redis
            - name: REDIS_PORT
              value: "6379"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector:4318/v1/traces
            - name: CONSOLE_LOG_STRUCTURED_FORMAT
              value: logstash
            - name: TRACING_SAMPLING_PROBABILITY
              value: "1.0"
            - name: OPENWEATHERMAP_API_KEY
              valueFrom:
                secretKeyRef:
                  name: camel-country-summary-secrets
                  key: OPENWEATHERMAP_API_KEY
            - name: EXCHANGERATE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: camel-country-summary-secrets
                  key: EXCHANGERATE_API_KEY
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: camel-country-summary
  namespace: camel-country-summary
spec:
  selector:
    app: camel-country-summary
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP
